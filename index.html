<style>
:root{box-sizing:border-box}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: app de una pantalla — cabecera, zona central con scroll y barra de pestañas inferior, pensada para el pulgar */
:root{
  --bg:#eaf0f5; --surface:#ffffff; --surface-2:#f4f7fa; --ink:#132030; --muted:#5a6b7e; --line:#d3dce6;
  --accent:#1f56d6; --accent-ink:#ffffff; --accent-soft:#dfe8fd;
  --good:#17703d; --good-soft:#d9f2e3; --bad:#a82a23; --bad-soft:#fbe0de; --warn:#b26b00;
  --c-am:#ff9a85; --c-at:#ffb347; --c-mt:#a597f0; --c-lan:#f08fcd; --c-act:#c49a7c;
  --c-mp:#bccad4; --c-sm:#5fd4ad; --c-nm:#b4de6e; --c-hal:#f8ee86; --c-gn:#8cc4ff;
  --lv0:#dfe5ec; --lv1:#f6c2bd; --lv2:#ffe08a; --lv3:#8fd9ab;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e151e; --surface:#17212d; --surface-2:#1d2938; --ink:#e5ecf4; --muted:#90a1b4; --line:#2a3748;
  --accent:#6e9bff; --accent-ink:#0b1424; --accent-soft:#1f2f52;
  --good:#4cc47f; --good-soft:#16362a; --bad:#ff6d63; --bad-soft:#41201e; --warn:#ffb648;
  --c-am:#9a3326; --c-at:#8f520a; --c-mt:#4a3a9e; --c-lan:#8c2f72; --c-act:#5a3c2a;
  --c-mp:#36586c; --c-sm:#146a50; --c-nm:#2f5a24; --c-hal:#6a6420; --c-gn:#2858b0;
  --lv0:#263241; --lv1:#6b2c28; --lv2:#6b5714; --lv3:#1f6a40;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e151e; --surface:#17212d; --surface-2:#1d2938; --ink:#e5ecf4; --muted:#90a1b4; --line:#2a3748;
  --accent:#6e9bff; --accent-ink:#0b1424; --accent-soft:#1f2f52;
  --good:#4cc47f; --good-soft:#16362a; --bad:#ff6d63; --bad-soft:#41201e; --warn:#ffb648;
  --c-am:#9a3326; --c-at:#8f520a; --c-mt:#4a3a9e; --c-lan:#8c2f72; --c-act:#5a3c2a;
  --c-mp:#36586c; --c-sm:#146a50; --c-nm:#2f5a24; --c-hal:#6a6420; --c-gn:#2858b0;
  --lv0:#263241; --lv1:#6b2c28; --lv2:#6b5714; --lv3:#1f6a40;
  color-scheme:dark;
}
html{box-sizing:border-box;background:var(--surface);overscroll-behavior-y:none;scrollbar-gutter:stable;scroll-padding-top:150px;scroll-padding-bottom:120px}
*,*::before,*::after{box-sizing:border-box}
body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#topbar{position:sticky;top:0;z-index:30;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
header{flex:none;background:var(--surface);padding-top:calc(env(safe-area-inset-top,0px) + 4px)}
#statusfill{position:fixed;top:0;left:0;right:0;height:max(1px,env(safe-area-inset-top,0px));background:var(--surface);z-index:100;pointer-events:none}
.hd{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:980px;margin:0 auto}
.logo{flex:none;width:40px;height:40px;border-radius:10px;display:block}
.logo i{font-style:normal;font:700 9px var(--f-mono)}
.logo b{font:700 17px var(--f-display);align-self:center;text-align:center}
.hd h1{font:700 17px/1.15 var(--f-display);margin:0;letter-spacing:-.01em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.scope{flex:none}
.hd h1 small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}
.hd .sp{flex:1}
.scope{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.scope label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.scope select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600;max-width:150px}
@media (pointer:coarse){.scope select,.search input{font-size:16px}}

main{background:var(--bg);overflow-x:clip}
.view{max-width:980px;margin:0 auto;padding-block:16px 28px;display:flex;flex-direction:column;gap:18px}
h2{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-display);margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:13.5px;letter-spacing:0;color:var(--muted);font-weight:600}

/* Pestañas inferiores */
nav.tabs{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.view{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))!important}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:680px;margin:0 auto;padding:4px 0 10px}
.tab{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 2px 7px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* Controles */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 8px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:18px;height:18px;border-radius:5px;border:1px solid rgb(0 0 0 / .15)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.t[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:none;color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px 11px 38px;font-size:15px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.results{display:flex;flex-wrap:wrap;gap:6px}
.results:empty{display:none}

/* Colores de categoría */
.k-am{--cat:var(--c-am)} .k-at{--cat:var(--c-at)} .k-mt{--cat:var(--c-mt)} .k-lan{--cat:var(--c-lan)} .k-act{--cat:var(--c-act)}
.k-mp{--cat:var(--c-mp)} .k-sm{--cat:var(--c-sm)} .k-nm{--cat:var(--c-nm)} .k-hal{--cat:var(--c-hal)} .k-gn{--cat:var(--c-gn)}

/* Tabla periódica */
.pt-scroll{overflow-x:auto;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:6px;scrollbar-width:thin}
.pt-wrap{container-type:inline-size}
.pt{display:grid;grid-template-columns:24px repeat(18,48px);grid-template-rows:22px repeat(7,52px) 12px repeat(2,52px);gap:2px;width:max-content}
.pt.fit{grid-template-columns:.5fr repeat(18,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:auto;width:100%;gap:1.5px}
.pt.fit .cell,.pt.fit .ph{aspect-ratio:1/1.12}
.pt.fit .gap-row{height:6px}
.lbl{font:600 11px var(--f-mono);color:var(--muted);display:flex;align-items:center;justify-content:center}
.pt.fit .lbl{font-size:max(6px,2.1cqi)}
.cell{position:relative;border:0;border-radius:5px;background:var(--cat,var(--lv0));padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;min-width:0;transition:opacity .15s,transform .1s}
.cell .z{position:absolute;top:3px;left:4px;font:500 11px var(--f-mono);opacity:.8}
.cell .s{font:700 19px var(--f-display);letter-spacing:-.02em;margin-top:8px}
.cell .n{display:none}
.pt.fit .cell{border-radius:3px}
.pt.fit .cell .z,.pt.fit .cell .n{display:none}
.pt.fit .cell.only-z .z{display:none!important}
.pt.fit .cell .s{margin-top:0}
.pt.fit .cell .s{font-size:max(8px,2.9cqi);letter-spacing:-.04em}
.cell:active{transform:scale(.94)}
.cell.dim{opacity:.18}
.cell.hide-s .s,.cell.hide-s .n{visibility:hidden}
.cell.only-z .s{font-family:var(--f-mono);font-weight:700;letter-spacing:-.03em}
.pt.mastery .cell{background:var(--lvc,var(--lv0))}
.ph{border:1px dashed var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font:600 11px var(--f-mono);color:var(--muted);text-align:center;line-height:1.1}
.pt.fit .ph{font-size:max(5px,1.5cqi)}
.frow-l{grid-column:1/4;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;font-weight:600;color:var(--muted)}
.pt.fit .frow-l{font-size:max(6px,1.8cqi)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lvleg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px}
.lvleg span{display:inline-flex;align-items:center;gap:6px}
.lvleg i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Familias */
.fam{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.fam article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fam .top{display:flex;align-items:baseline;gap:8px}
.fam .g{font:700 11px var(--f-mono);background:var(--cat);padding:3px 7px;border-radius:6px}
.fam .els{display:flex;flex-wrap:wrap;gap:4px}
.fam .els button{border:0;background:var(--cat);border-radius:6px;font:700 13px var(--f-display);padding:4px 7px;min-width:34px}
.fam .mn{font-size:13.5px;color:var(--muted)}
.fam .mn b{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
.fam .meta{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}

/* Hoja de detalle */
.sheet-bg{position:fixed;inset:0;overscroll-behavior:contain;touch-action:none;background:rgb(5 10 18 / .5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.el-head{display:flex;gap:14px;align-items:center}
.bigtile{flex:none;width:96px;height:104px;border-radius:12px;background:var(--cat);display:flex;flex-direction:column;justify-content:space-between;padding:7px 9px;line-height:1}
.bigtile .z{font:700 14px var(--f-mono)}
.bigtile .s{font:700 40px var(--f-display);letter-spacing:-.03em}
.bigtile .m{font:500 11px var(--f-mono);opacity:.8}
.el-head h2{font-size:24px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.facts div{background:var(--surface);padding:9px 11px;min-width:0}
.facts dt{font-size:13px;letter-spacing:0;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:600}
.facts .wide{grid-column:1/-1}
.mono{font-family:var(--f-mono);font-weight:500;font-size:13.5px;word-break:break-word}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.sheet-nav{display:flex;gap:8px;margin-top:14px}
.sheet-nav .btn{flex:1;padding:11px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--cat,var(--surface-2))}

/* Fichas */
.flash-wrap{display:flex;flex-direction:column;gap:14px;align-items:stretch;max-width:440px;margin:0 auto;width:100%}
.card3d{perspective:1200px;height:clamp(200px,calc(100dvh - 450px),400px);touch-action:pan-y}
.card3d .inner.drag{transition:none}
.card3d .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgb(10 20 40 / .5);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:8px}
.face.back{transform:rotateY(180deg);justify-content:flex-start;padding-top:22px}
.face .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.face .huge{font:700 min(30vw,120px)/1 var(--f-display);letter-spacing:-.04em}
.face .namebig{font:700 min(10vw,40px)/1.1 var(--f-display);text-wrap:balance}
.face .stripe{position:absolute;inset:0 0 auto;height:10px;border-radius:22px 22px 0 0;background:var(--cat)}
.back .facts{width:100%;margin-top:6px;text-align:left}
.flash-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.no{background:var(--bad-soft);color:var(--bad)}
.btn.yes{background:var(--good-soft);color:var(--good)}
.counter{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* Test */
.quiz{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.qtype{font-size:13.5px;letter-spacing:0;font-weight:700;color:var(--accent)}
.qprompt{font:600 19px/1.3 var(--f-display);text-wrap:balance}
.qbig{font:700 64px/1 var(--f-display);letter-spacing:-.03em;padding:8px 22px;border-radius:16px;background:var(--cat,var(--surface-2))}
.qname{font:700 30px/1.1 var(--f-display)}
.opts{display:grid;gap:9px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:12px;min-height:54px}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:700 12px var(--f-mono);color:var(--muted)}
.opt .mono{font-size:13px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 14px;font-size:14.5px;scroll-margin-bottom:90px}
.feedback.ok{background:var(--good-soft)}
.feedback.ko{background:var(--bad-soft)}
.feedback strong{display:block;font-family:var(--f-display);font-size:16px;margin-bottom:2px}
.feedback.ok strong{color:var(--good)} .feedback.ko strong{color:var(--bad)}
.mini{width:100%;max-width:340px}
.deckpick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 14px}
.deckpick span{font-weight:600;font-size:14px;color:var(--muted)}
.deckpick select{flex:1;min-height:44px;border:0;background:transparent;font:600 16px var(--f-body);color:var(--ink);padding:0 8px}
/* Pregunta respondida: la pregunta se encoge para que quepa todo sin perderla de vista */
.quiz.answered .qcard{padding:10px 14px;gap:6px}
.quiz.answered .qcard .qbig{font-size:34px;padding:3px 12px;border-radius:10px}
.quiz.answered .qcard .qprompt{font-size:15px}
.quiz.answered .qcard .mini{max-width:200px}
.quiz.answered .qcard .muted{font-size:13px}
.mini .pt.fit{gap:1px}
.mini .cell{border-radius:2px;background:var(--lv0)}
.mini .cell.target{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
.mini .cell .s{color:var(--accent-ink)}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.score{font:700 56px/1 var(--f-display);letter-spacing:-.03em}
.miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.miss button{border:0;border-radius:8px;background:var(--cat);padding:6px 9px;font:700 14px var(--f-display)}

/* Progreso */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 24px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);line-height:1.2}
.stat i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--lv0)}
.stack i{display:block;height:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border-radius:12px;padding:10px 12px}

/* Móvil: más compacto en pantallas pequeñas o bajas */
@media (max-width:420px){
  .hd{gap:10px}.hd h1{font-size:16px}.scope select{max-width:122px;padding-inline:6px}
  .view{gap:14px;padding-block:12px 20px}
  .hd{padding-block:8px}
  .pt-wrap.full{margin-inline:-8px}
  .pt.fit{gap:1px}
}
@media (max-height:760px){
  .view{gap:12px;padding-top:10px}
  .tabs-in{padding:2px 0 6px}.tab{min-height:46px;padding:4px 2px}
  .hd{padding-block:4px}
  .qcard{padding:14px 14px;gap:8px}
  .qbig{font-size:48px;padding:6px 18px}
  .qname{font-size:26px}
  .qprompt{font-size:17px}
  .opt{min-height:48px;padding:10px 12px}
  .opts{gap:7px}
}
/* Barra fija con «Siguiente», siempre a mano */
.next-bar{position:sticky;bottom:0;z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.rotate-hint{display:none;font-size:12.5px;color:var(--muted);align-items:center;gap:6px}
@media (orientation:portrait) and (max-width:500px){.rotate-hint{display:flex}}
.swipe-hint{font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 0}
.sheet.drag{transition:none;animation:none}
/* Móvil en horizontal: cabecera y pestañas compactas y la tabla entera arriba, ajustada al alto */
@media (orientation:landscape) and (max-height:500px){
  .hd{padding-block:5px}.logo{width:32px;height:32px}.logo b{font-size:13px}.hd h1 small{display:none}
  .tab{flex-direction:row;justify-content:center;gap:6px;padding:6px 4px}.tab svg{width:20px;height:20px}
  .view{padding-block:8px 16px;gap:12px}
  .zoom-box{order:-1}
  #ptw{width:calc(min(100%,calc((100dvh - 100px) * 1.55)) * var(--z,1));margin-inline:auto}
}
/* Colocar en la tabla */
.placeq{width:100%}
.placeq .cell{background:var(--surface-2);border:1px solid var(--line)}
.placeq .cell.okc{background:var(--good);border-color:var(--good);color:#fff}
.placeq .cell.koc{background:var(--bad);border-color:var(--bad);color:#fff}
.placeq .cell:disabled{cursor:default}
.placeq .cell .s{font-size:max(7px,2.6cqi)}
/* Rellenar familias */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.set{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:64px}
.set b{font:600 14.5px var(--f-display)}
.set span{font-size:12px;color:var(--muted)}
.set .best{font-size:12px;font-weight:600}
.set .best.ok{color:var(--good)}
.fill-col{display:flex;flex-direction:column;gap:6px;align-items:center}
.fill-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{display:flex;align-items:center;gap:8px}
.slot .pl{width:24px;text-align:right;font:600 11px var(--f-mono);color:var(--muted)}
.box{width:60px;height:56px;border-radius:10px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;font:700 20px var(--f-display);position:relative}
.fill-row .box{width:clamp(34px,10.5vw,58px)}
.box.cur{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px var(--accent-soft)}
.box.done{border-style:solid;border-color:transparent;background:var(--cat)}
.box.bad{border-color:var(--bad);border-style:solid;background:var(--bad-soft);color:var(--bad)}
.box small{position:absolute;top:2px;left:4px;font:500 11px var(--f-mono);opacity:.75}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bank button{min-width:56px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:700 19px var(--f-display)}
.bank button.used{visibility:hidden}
.bank button.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hintbox{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.hintbox b{text-decoration:underline;text-decoration-color:var(--accent)}
/* Pantallas táctiles: todo lo que se toca mide al menos 44 pt (guía de Apple) */
@media (pointer:coarse){
  .seg button{min-height:42px;padding-inline:12px}
  .seg{padding:2px}
  .chip{min-height:44px;padding-inline:12px}
  .fam .els button{min-width:44px;min-height:44px}
  .miss button{min-width:44px;min-height:44px}
  .ver{min-height:44px}
  .exitbtn,.sizeseg button,#ib-how{min-height:44px}
  .scope select{min-height:44px}
  .sheet-nav .btn{min-height:46px}
}
/* Ajustes, tamaño de letra e instalación */
.gear{flex:none;width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
#gear{margin-right:-10px}
#find{margin-right:-6px}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear:active{background:var(--surface-2)}
.sheet:focus{outline:none}
.hd h1 small span{font-family:var(--f-mono);font-size:11px}
:root[data-fs="s"] main,:root[data-fs="s"] .sheet{zoom:.9}
:root[data-fs="l"] main,:root[data-fs="l"] .sheet{zoom:1.15}
:root[data-fs="xl"] main,:root[data-fs="xl"] .sheet{zoom:1.3}
:root[data-fs="xxl"] main,:root[data-fs="xxl"] .sheet{zoom:1.6}
.set-group{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.set-group .seg{align-self:stretch;grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.preview{font-size:15px;color:var(--muted)}
.install-banner{display:flex;align-items:center;gap:10px;background:#ffe066;color:#2b2100;border:1.5px solid #e6bf2e;border-radius:14px;padding:10px 6px 10px 12px;box-shadow:0 6px 18px -10px rgb(120 90 0 / .6)}
.install-banner .btn{background:#2b2100;color:#ffe066}
.install-banner .x{color:#5c4a00}
:root[data-theme="dark"] .install-banner{background:#5a4706;color:#fff3c4;border-color:#8a6e12}
:root[data-theme="dark"] .install-banner .btn{background:#ffe066;color:#2b2100}
:root[data-theme="dark"] .install-banner .x{color:#fff3c4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .install-banner{background:#5a4706;color:#fff3c4;border-color:#8a6e12}:root:not([data-theme="light"]) .install-banner .btn{background:#ffe066;color:#2b2100}:root:not([data-theme="light"]) .install-banner .x{color:#fff3c4}}
.install-banner .ic{flex:none;width:36px;height:36px;border-radius:9px;overflow:hidden}
.install-banner .ic img{width:100%;height:100%;display:block}
.install-banner div{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.install-banner b{display:block;font-size:14.5px}
.install-banner .btn{padding:10px 14px;font-size:14px;font-weight:700}
.install-banner .x{flex:none;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:20px}
.steps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px;counter-increment:st}
.steps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-mono)}
.steps svg{width:20px;height:20px;vertical-align:-4px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kbd{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 6px;font-weight:600}
/* Tabla: controles con etiqueta y pista */
.ctrls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl-l{font-size:13.5px;letter-spacing:0;color:var(--muted);font-weight:600;padding-left:2px}
.tip{margin:0;font-size:13.5px;color:var(--muted)}
.cell.out{opacity:.42}
/* Zoom con pellizco */
.zoom-box{position:relative}
#ptz{touch-action:pan-x pan-y;overflow:auto;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:4px}
#ptw{width:calc(100% * var(--z,1));max-width:none}
.zoom-ctl{position:absolute;right:0;bottom:-6px;transform:translateY(100%);display:flex;gap:6px}
.zoom-ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 22px/1 var(--f-body);color:var(--ink);box-shadow:0 2px 6px -3px rgb(0 0 0 / .3)}
.zoom-ctl button:disabled{opacity:.35}
.zoom-box{margin-bottom:46px}
/* Con zoom: aparecen el número atómico y el nombre */
@container (min-width:640px){.pt.fit .cell .z{display:block;font-size:max(9px,.85cqi)}.pt.fit .cell .s{margin-top:.6cqi}}
@container (min-width:1100px){.pt.fit .cell .z{font-size:max(11px,.75cqi)}.pt.fit .cell .n{display:block;font-size:max(11px,.55cqi);max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;opacity:.85}}
/* Leyenda agrupada con botones rectangulares */
.leg-g{display:flex;flex-direction:column;gap:6px}
.chip.rect{border-radius:10px}
/* Pantalla principal reorganizada */
.tipbox{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 4px 8px 12px;font-size:13.5px;line-height:1.4}
.tipbox span{flex:1}.tipbox .x,.install-banner .x{flex:none;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:20px}
.modechip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.modechip button{border:0;background:var(--surface-2);border-radius:9px;padding:0 10px;min-height:36px;font-size:13px;font-weight:600;color:var(--accent)}
.tbl-bar{position:absolute;left:0;bottom:-6px;transform:translateY(100%)}
.tbl-bar .btn{min-height:44px;padding:0 14px;font-size:14px}
.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;min-height:44px}
.fold summary::-webkit-details-marker{display:none}
.fold summary span{display:flex;flex-direction:column;gap:4px}
.fold .chev{font-size:20px;color:var(--muted);transition:transform .2s}
.fold[open] .chev{transform:rotate(90deg)}
.fold .fam{margin-top:10px}
/* Juego: colocar en su sitio */
.gcats{display:flex;flex-direction:column;gap:12px}
.gbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:56px;text-align:left}
.gbtn .t{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.gbtn .sub{font-size:12px;color:var(--muted)}
.gbtn .sub.ok{color:var(--good);font-weight:600}
.gcats .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gwrap .cell{background:var(--surface-2)!important;color:transparent}
.gwrap .cell.gt{background:var(--surface)!important;outline:1.5px dashed var(--muted);outline-offset:-1.5px}
.gwrap .cell.gok{background:var(--cat)!important;color:var(--ink)}
.gwrap .cell.ghl{outline:3px solid var(--accent)!important;outline-offset:-1px;background:var(--accent-soft)!important}
.gwrap .cell.gbad{animation:shake .35s;outline:none!important}
.gwrap .cell.ggood{animation:pop .35s ease-out}
.gwrap .cell.ggood::after,.gwrap .cell.gbad::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:ovl 1.8s forwards}
.gwrap .cell.ggood::after{background:var(--good)}
.gwrap .cell.gbad::after{background:var(--bad)}
.gwrap .cell.ggood .s,.gwrap .cell.gbad .s{position:relative;z-index:1}
.gwrap .cell.ggood .s{animation:txtok 1.8s forwards}
.gwrap .cell.gbad .s{animation:txtko 1.8s forwards}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes ovl{0%,65%{opacity:1}100%{opacity:0}}
@keyframes txtok{0%,65%{color:#fff}100%{color:var(--ink)}}
@keyframes txtko{0%,65%{color:#fff}100%{color:transparent}}
@media (prefers-reduced-motion:reduce){.gwrap .cell.ggood::after,.gwrap .cell.gbad::after{animation:none;opacity:0}.gwrap .cell.ggood{box-shadow:inset 0 0 0 3px var(--good)}.gwrap .cell.gbad{box-shadow:inset 0 0 0 3px var(--bad)}}
.tray{position:sticky;bottom:0;z-index:6;background:var(--bg);box-shadow:0 -10px 12px -6px var(--bg);padding:8px 0 4px;display:flex;flex-direction:column;gap:4px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tray .tiles{display:flex;flex-wrap:nowrap;gap:8px;justify-content:safe center;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tray .tiles .gtile{flex:0 1 52px;min-width:44px}
.gtile{min-width:52px;height:52px;border-radius:12px;border:1.5px solid rgb(0 0 0 / .12);background:var(--cat);font:700 21px var(--f-display);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 8px -4px rgb(0 0 0 / .35)}
.gtile.sel{outline:3px solid var(--accent);outline-offset:2px}
.gtile.dragging{opacity:.25}
#ghost{position:fixed;z-index:80;pointer-events:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font:700 26px var(--f-display);color:#132030;box-shadow:0 12px 24px -8px rgb(0 0 0 / .5);transform:translate(-50%,-50%) scale(1.05)}
@media (orientation:landscape) and (max-height:500px){ .gwrap{width:min(100%,calc((100dvh - 190px) * 1.55));margin-inline:auto} }
/* Autoría y aviso */
.about{display:flex;align-items:center;gap:12px}.about img{border-radius:11px}
.disclaimer{background:#fff4d1;color:#4a3800;border:1px solid #f0d27a;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
:root[data-theme="dark"] .disclaimer{background:#3d3208;color:#fff0bf;border-color:#6b5713}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .disclaimer{background:#3d3208;color:#fff0bf;border-color:#6b5713}}
.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px}
.foot p{margin:0}.foot b{color:var(--ink);font-weight:600}
/* Juego: herramientas y mensajes */
.gtools{display:flex;gap:8px;flex-wrap:wrap}
.gtools .btn{padding:0 12px;min-height:44px;font-size:14px}
.ggrid{justify-content:center}
.gwrap .cell.ghint{outline:3px solid var(--accent)!important;outline-offset:-1px;animation:pulse 1s ease-in-out infinite}
.gmsg{margin:0;text-align:center;font-size:13.5px;color:var(--muted);min-height:2.6em}
.gwrap button.cell{cursor:pointer}
.exitbtn{border:0;background:var(--surface-2);border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;font-size:13.5px;color:var(--ink)}
/* Zoom 1× 2× 3× */
.zoom-box{margin-bottom:0}
.zseg{position:absolute;z-index:4;top:12px;left:calc(13.6% + 4px);transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 2px 8px -4px rgb(0 0 0 / .3)}
.zseg button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 22px/1 var(--f-body);color:var(--ink)}
.zseg button:disabled{opacity:.35}
.zseg output{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.gwrap ~ .zseg,.zoom-box.game .zseg{position:static;margin-bottom:8px;display:inline-flex;transform:none}
.tbl-bar{position:static;transform:none;margin-top:8px}
/* Impresión */
.printbtns{display:flex;flex-wrap:wrap;gap:8px}.printbtns .btn{padding:0 12px;min-height:44px;font-size:14px}
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff!important;min-height:0}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-family:var(--f-body)}
  .phead{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;margin-bottom:4mm}
  .phead h1{font:700 15pt var(--f-display);margin:0}
  .pfields{display:flex;gap:6mm;font-size:10pt}
  .pgrid{display:grid;grid-template-columns:6mm repeat(18,1fr);grid-template-rows:5mm repeat(7,14.5mm) 3mm repeat(2,14.5mm);gap:.8mm}
  .pl{font:600 8pt var(--f-mono);display:flex;align-items:center;justify-content:center;color:#444}
  .pf{font-size:8pt;display:flex;align-items:center;justify-content:flex-end;padding-right:2mm;color:#444}
  .pc{border:.35mm solid #222;border-radius:1mm;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .ps{font:700 13pt var(--f-display);margin-top:1.5mm}
  .pn{font-size:5.5pt;max-width:95%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .pfoot{font-size:7pt;color:#555;margin:3mm 0 0;text-align:center}
}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:700}
.skip:focus{top:8px}
main:focus{outline:none}
.qgroup{display:flex;flex-direction:column;gap:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105%;margin-left:var(--dx);transform:rotate(540deg)}}
.gwrap .cell.gpend{outline:3px solid var(--accent)!important;outline-offset:-1px;background:var(--accent-soft)!important;color:var(--accent)!important}
.gwrap .cell.gpend .s{opacity:.85}
.tray.gconfirm{border-top:2px solid var(--accent)}
#ptz.scrub{touch-action:pan-y}
.cell.scrubhl{outline:2.5px solid var(--ink);outline-offset:1px;z-index:2}
#scrubbub{position:fixed;z-index:90;pointer-events:none;border-radius:12px;background:var(--surface);border:2px solid var(--ink);box-shadow:0 10px 22px -10px rgb(0 0 0 / .45);display:flex;align-items:stretch;gap:8px;padding:4px;color:var(--ink);overflow:hidden}
#scrubbub .bt{flex:none;aspect-ratio:1/1.05;height:100%;border-radius:8px;background:var(--cat);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;line-height:1}
#scrubbub .bt .z{position:absolute;top:3px;left:5px;font:700 11px var(--f-mono)}
#scrubbub .bt .s{font:700 clamp(20px,6.5vw,40px) var(--f-display);letter-spacing:-.03em;margin-top:6px}
#scrubbub .bi{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;line-height:1.15}

const PROP={3:[.98,520,145],4:[1.57,899,105],5:[2.04,801,85],6:[2.55,1086,70],7:[3.04,1402,65],8:[3.44,1314,60],9:[3.98,1681,50],11:[.93,496,180],12:[1.31,738,150],13:[1.61,578,125],14:[1.90,787,110],15:[2.19,1012,100],16:[2.58,1000,100],17:[3.16,1251,100],19:[.82,419,220],20:[1.00,590,180],31:[1.81,579,130],32:[2.01,762,125],33:[2.18,947,115],34:[2.55,941,115],35:[2.96,1140,115],37:[.82,403,235],38:[.95,549,200],49:[1.78,558,155],50:[1.96,709,145],51:[2.05,834,145],52:[2.10,869,140],53:[2.66,1008,140],55:[.79,376,260],56:[.89,503,215]};
const TPROPS={radio:"mayor radio atómico",en:"mayor electronegatividad",ei:"mayor energía de ionización",met:"más carácter metálico"};
// Elige una pareja en el mismo grupo o periodo en la que la regla del libro coincide con los datos reales
function trendPair(){
  const zs=Object.keys(PROP).map(Number);
  for(let k=0;k<200;k++){
    const a=BYZ[zs[Math.floor(Math.random()*zs.length)]];
    const same=zs.map(z=>BYZ[z]).filter(b=>b.z!==a.z&&(b.g===a.g||b.p===a.p));
    if(!same.length)continue;
    const b=same[Math.floor(Math.random()*same.length)];
    const prop=Object.keys(TPROPS)[Math.floor(Math.random()*4)];
    const sp=a.p===b.p, A=PROP[a.z],B=PROP[b.z];
    // regla
    let rule;
    if(prop==="radio"||prop==="met")rule=sp?(a.g<b.g?a:b):(a.p>b.p?a:b);
    else rule=sp?(a.g>b.g?a:b):(a.p<b.p?a:b);
    // datos
    const idx={en:0,ei:1,radio:2,met:0}[prop];
    let va=A[idx],vb=B[idx];if(prop==="met"){va=-va;vb=-vb}
    if(Math.abs(va-vb)/Math.max(Math.abs(va),Math.abs(vb))<.05)continue;
    const data=va>vb?a:b;
    if(data!==rule)continue;
    return {a,b,prop,ans:rule,sp};
  }
  return null;
}
function trendExpl(t){
  const {a,b,prop,ans,sp}=t, o=ans===a?b:a;
  const where=sp?`están en el mismo periodo (${a.p})`:`están en el mismo grupo (${a.g})`;
  const rule={radio:sp?"en un periodo, el radio disminuye hacia la derecha (→)":"en un grupo, el radio aumenta hacia abajo (↓)",
    met:sp?"en un periodo, el carácter metálico disminuye hacia la derecha (→)":"en un grupo, el carácter metálico aumenta hacia abajo (↓)",
    en:sp?"en un periodo, la electronegatividad aumenta hacia la derecha (→)":"en un grupo, la electronegatividad disminuye hacia abajo (↓)",
    ei:sp?"en un periodo, la energía de ionización aumenta hacia la derecha (→)":"en un grupo, la energía de ionización disminuye hacia abajo (↓)"}[prop];
  const val={radio:z=>PROP[z][2]+" pm",en:z=>String(PROP[z][0]).replace(".",","),ei:z=>PROP[z][1]+" kJ/mol",met:null}[prop];
  return `${a.s} y ${b.s} ${where}: ${rule}. Por eso es el <b>${ans.n.toLowerCase()} (${ans.s})</b>${val?` (${val(ans.z)} frente a ${val(o.z)})`:""}.`;
}

    if(t==="gp")cands=P.filter(e=>!e.f);

function gameTable(G,inG){
  // Solo las columnas (y filas f) donde está la familia, con una de margen: casillas más grandes y fáciles de acertar
  const pos=G.items.map(z=>gridPos(BYZ[z]));
  let c0=Math.max(2,Math.min(...pos.map(p=>p.col))-1),c1=Math.min(19,Math.max(...pos.map(p=>p.col))+1);
  if(c1-c0<3){const m=3-(c1-c0);c0=Math.max(2,c0-Math.ceil(m/2));c1=Math.min(19,c0+3)}
  const needF=pos.some(p=>p.row>=10), n=c1-c0+1, full=n>=17;
  const rows=needF?11:8;
  let h=`<div class="pt fit ggrid" style="grid-template-columns:${full?".5fr":"28px"} repeat(${n},minmax(0,${full?"1fr":"calc(max(30px, min(46px, (100dvh - 405px) / 8.6)) * var(--z,1))"}))">`;
  for(let c=c0;c<=c1;c++)h+=`<div class="lbl" style="grid-column:${c-c0+2};grid-row:1">${c-1}</div>`;
  for(let r=1;r<=7;r++)h+=`<div class="lbl" style="grid-column:1;grid-row:${r+1}">${r}</div>`;
  if(needF)h+=`<div class="gap-row" style="grid-column:1/-1;grid-row:9"></div><div class="lbl" style="grid-column:1;grid-row:10">Lan</div><div class="lbl" style="grid-column:1;grid-row:11">Act</div>`;
  for(const e of E){const p=gridPos(e);if(p.col<c0||p.col>c1||p.row>rows)continue;
    const tgt=inG.has(e.z),ok=G.placed.has(e.z);let c=tgt?(ok?" gok":" gt"):"";
    if(G.bad===e.z)c+=" gbad";if(G.hint===e.z)c+=" ghint";if(G.good===e.z)c+=" ggood";
    const pend=G.pending&&G.pending.target===e.z;if(pend)c+=" gpend";
    const lab=`${e.f?(e.c==="lan"?"Lantánidos":"Actínidos"):"Grupo "+e.g}, periodo ${e.p}`;
    h+=tgt&&!ok?`<button class="cell k-${e.c}${c}" style="grid-column:${p.col-c0+2};grid-row:${p.row}" data-gz="${e.z}" aria-label="Casilla vacía: ${lab}"><span class="s">${pend?BYZ[G.pending.z].s:G.bad===e.z&&G.badZ?BYZ[G.badZ].s:""}</span></button>`
      :`<div class="cell k-${e.c}${c}" style="grid-column:${p.col-c0+2};grid-row:${p.row}" data-gz="${e.z}" ${ok?`aria-label="${e.n}, colocado"`:'aria-hidden="true"'}><span class="s">${ok?e.s:pend?BYZ[G.pending.z].s:G.bad===e.z&&G.badZ?BYZ[G.badZ].s:""}</span></div>`;
  }
  return h+"</div>";
}
// Zoom automático: al entrar con la ficha en la tabla, si las casillas son pequeñas, se acerca alrededor del dedo;
// cerca de los bordes, la tabla se desplaza sola; al soltar, vuelve al zoom anterior
function autoZoom(d,x,y){
  const box=$("#ptz");if(!box)return;const r=box.getBoundingClientRect();
  const inside=x>=r.left&&x<=r.right&&y>=r.top-20&&y<=r.bottom+20;
  if(!d.zoomed&&inside){
    const cell=box.querySelector(".cell");const cw=cell?cell.getBoundingClientRect().width:99;
    if(cw<40){d.zoomed=true;d.prevZ=ZOOM;setZoom(Math.min(ZMAX,ZOOM*Math.max(1.8,44/cw)),x,y)}
  }
  if(d.zoomed){
    clearInterval(d.edge);const m=36,dx=x<r.left+m?-1:x>r.right-m?1:0,dy=y<r.top+m?-1:y>r.bottom-m?1:0;
    if(dx||dy)d.edge=setInterval(()=>{box.scrollLeft+=dx*10;if(dy)SC.scrollTop+=dy*8;
      const c=cellAt(x,y);if(d.hl&&d.hl!==c)d.hl.classList.remove("ghl");if(c)c.classList.add("ghl");d.hl=c},30);
  }
}

function cellAt(x,y){
  let best=null,bd=1e9;
  document.querySelectorAll(".gwrap .cell[data-gz]").forEach(c=>{const r=c.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const d=Math.hypot(x-cx,y-cy);if(d<bd&&d<Math.max(r.width,r.height)*.9){bd=d;best=c}});
  return best;
}

// Versión de iOS: Safari 26 deja fija la del sistema en 18_x, así que se usa «Version/NN» cuando está
function iosVersion(){
  const sv=UA.match(/Version\/(\d+)(?:\.(\d+))?.*Safari/);
  if(sv&&!IOS_OTHER)return [+sv[1],+(sv[2]||0)];
  const os=UA.match(/OS (\d+)_(\d+)/);return os?[+os[1],+os[2]]:[0,0];
}
const IS_IPAD=/iPad/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function isStandalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();deferredPrompt=ev;if(PREF.tab==="tabla"&&$("#sheet").hidden)renderTabla()});
addEventListener("appinstalled",()=>{deferredPrompt=null;store.set("tp-install-hide",1);closeSheet();if(PREF.tab==="tabla")renderTabla()});
function installBannerHTML(){
  if(isStandalone()||store.get("tp-install-hide",0))return "";
  if(!IS_IOS&&!IS_ANDROID&&!deferredPrompt)return "";
  return `<div class="install-banner"><span class="ic"><img src="icon-192.png" alt=""></span>
    <div><b>📲 Instálala en tu móvil</b>Tenla en la pantalla de inicio, como una app.</div>
    <button class="btn" id="ib-how">${deferredPrompt?"Instalar":"Ver cómo"}</button>
    <button class="x" id="ib-x" aria-label="No mostrar más">×</button></div>`;
}
async function installNow(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  try{await deferredPrompt.userChoice}catch(e){}
  deferredPrompt=null;
}
const SHARE_SVG='<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
const DOTS_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>';
const HDOTS_SVG='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
const PLUS_SVG='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>';
function openInstall(){
  if(deferredPrompt&&!IS_IOS){installNow();return}
  let body;
  if(IN_APP){
    body=`<p style="margin:12px 0 0">Has abierto el enlace dentro de otra app. Para instalarla, ábrela primero en el navegador:</p>
      <ol class="steps"><li><span>Toca el menú ${DOTS_SVG} o el botón ${SHARE_SVG} de esta pantalla.</span></li>
      <li><span>Elige <b>«Abrir en ${IS_IOS?"Safari":"Chrome"}»</b> (o «Abrir en el navegador»).</span></li>
      <li><span>Allí, vuelve a tocar <b>⚙️ → Cómo añadirla a la pantalla de inicio</b>.</span></li></ol>`;
  }else if(IS_IOS){
    const [maj,min]=iosVersion(), dev=IS_IPAD?"iPad":"iPhone";
    const ver=maj?`<p class="hintbox" style="margin:12px 0 0;text-align:left">Tu ${dev} tiene <b>iOS ${maj}${min?"."+min:""}</b>. Estos son los pasos para esa versión.</p>`:"";
    const end=`<li><span>Si aparece <b>«Abrir como app web»</b>, déjalo activado y pulsa <span class="kbd">Añadir</span> (arriba a la derecha).</span></li>
      <li><span>Listo: el icono <b>Tabla periódica</b> aparecerá en tu pantalla de inicio. Ábrela siempre desde ahí.</span></li>`;
    if(maj&&(maj<16||(maj===16&&min<4))&&IOS_OTHER){
      body=ver+`<p style="margin:12px 0 0">En esta versión de iOS solo se puede instalar desde <b>Safari</b>:</p>
        <ol class="steps"><li><span>Copia el enlace y ábrelo en <b>Safari</b>. <button class="btn ghost" id="inst-copy" style="margin-top:6px;padding:8px 12px;font-size:14px">Copiar enlace</button></span></li>
        <li><span>Toca el botón <b>Compartir</b> ${SHARE_SVG} de la barra de abajo.</span></li>
        <li><span>Elige <b>«Añadir a pantalla de inicio»</b> ${PLUS_SVG}.</span></li>${end}</ol>`;
    }else if(IOS_OTHER){
      body=ver+`<p style="margin:12px 0 0">Desde este navegador (o desde Safari):</p>
        <ol class="steps"><li><span>Toca el botón <b>Compartir</b> ${SHARE_SVG}, en la barra de direcciones (arriba a la derecha) o en el menú del navegador.</span></li>
        <li><span>Elige <b>«Añadir a pantalla de inicio»</b> ${PLUS_SVG}. Si no está, toca <b>«Más»</b> o baja en la lista.</span></li>${end}</ol>`;
    }else if(maj>=26){
      body=ver+`<ol class="steps">
        <li><span>Toca el botón <b>···</b> ${HDOTS_SVG} que está a la derecha de la barra de la dirección${IS_IPAD?" (arriba)":" (abajo)"}.</span></li>
        <li><span>Toca <b>«Compartir»</b> ${SHARE_SVG}.</span></li>
        <li><span>Toca <b>«Ver más»</b> si hace falta, baja en la lista y elige <b>«Añadir a pantalla de inicio»</b> ${PLUS_SVG}.</span></li>${end}</ol>`;
    }else{
      body=ver+`<ol class="steps">
        <li><span>Toca el botón <b>Compartir</b> ${SHARE_SVG}${IS_IPAD?", arriba a la derecha.":", en el centro de la barra de abajo. Si no ves la barra, desliza un poco la página hacia arriba."}</span></li>
        <li><span>Baja en la lista y elige <b>«Añadir a pantalla de inicio»</b> ${PLUS_SVG}.</span></li>${end}</ol>`;
    }
  }else if(IS_ANDROID){
    body=`<p style="margin:12px 0 0">En el móvil Android, con Chrome:</p>
      <ol class="steps">
      <li><span>Toca el menú ${DOTS_SVG} (arriba a la derecha).</span></li>
      <li><span>Elige <b>«Añadir a pantalla de inicio»</b> o <b>«Instalar aplicación»</b>.</span></li>
      <li><span>Pulsa <span class="kbd">Instalar</span>. El icono aparecerá en tu pantalla de inicio.</span></li></ol>`;
  }else{
    body=`<p style="margin:12px 0 0">Está pensada para el móvil: abre este mismo enlace en el teléfono y sigue los pasos que salen allí.</p>
      <ol class="steps"><li><span>En el ordenador también se puede instalar con Chrome o Edge: busca el icono de instalar ${PLUS_SVG} a la derecha de la barra de direcciones.</span></li></ol>`;
  }
  const s=$("#sheet");
  s.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Instalar en el móvil">
    <div class="grab"></div><button class="xbtn" data-close="1" aria-label="Cerrar">✕</button>
    <div class="el-head"><img src="icon-192.png" alt="" style="width:56px;height:56px;border-radius:13px"><div><h2>Instalar la app</h2><span class="muted" style="font-size:13px">Gratis, sin tienda y sin registrarse</span></div></div>
    ${body}
    <p class="muted" style="font-size:13px;margin:12px 0 0">Una vez instalada se abre a pantalla completa, funciona sin conexión y se actualiza sola.</p>
    <div class="sheet-nav">${deferredPrompt?`<button class="btn block" id="inst-now">Instalar ahora</button>`:`<button class="btn block" data-close="1">Entendido</button>`}</div>
  </div></div>`;
  s.hidden=false;sheetShown();
}
// Enlace directo a las instrucciones: ...tabla-periodica/?instalar
if(/[?&]instalar\b/.test(location.search)&&!isStandalone()){history.replaceState(null,"",location.pathname);setTimeout(openInstall,400)}
render();

/* ===================== GESTOS TÁCTILES ===================== */
// Hoja de detalle: arrastrar hacia abajo para cerrar
(function(){
  let y0=null,dy=0,el=null;
  $("#sheet").addEventListener("touchstart",ev=>{el=ev.target.closest(".sheet");if(!el||el.scrollTop>0){el=null;return}y0=ev.touches[0].clientY;dy=0},{passive:true});
  $("#sheet").addEventListener("touchmove",ev=>{if(!el)return;dy=ev.touches[0].clientY-y0;if(dy>0){el.classList.add("drag");el.style.transform=`translateY(${dy}px)`}else{el.style.transform=""}},{passive:true});
  $("#sheet").addEventListener("touchend",()=>{if(!el)return;el.classList.remove("drag");if(dy>90)closeSheet();else el.style.transform="";el=null});
  $("#sheet").addEventListener("touchcancel",()=>{if(!el)return;el.classList.remove("drag");el.style.transform="";el=null});
})();
// Fichas: con la tarjeta girada, deslizar a la derecha = me la sabía, a la izquierda = no
(function(){
  let x0=null,y0=0,dx=0,inner=null,swiped=false;
  main.addEventListener("touchstart",ev=>{const c=ev.target.closest("#card");if(!c||!FL||!FL.flipped){inner=null;return}inner=c.querySelector(".inner");x0=ev.touches[0].clientX;y0=ev.touches[0].clientY;dx=0},{passive:true});
  main.addEventListener("touchmove",ev=>{if(!inner)return;dx=ev.touches[0].clientX-x0;const dy=ev.touches[0].clientY-y0;if(Math.abs(dx)<Math.abs(dy)){dx=0;inner.classList.remove("drag");inner.style.transform="";return}inner.classList.add("drag");inner.style.transform=`rotateY(180deg) translateX(${-dx}px) rotate(${-dx/25}deg)`},{passive:true});
  main.addEventListener("touchend",()=>{if(!inner)return;inner.classList.remove("drag");inner.style.transform="";if(Math.abs(dx)>80){swiped=true;setTimeout(()=>swiped=false,400);flashAnswer(dx>0);if(dx<0)vibrar(40)}inner=null});
  main.addEventListener("touchcancel",()=>{if(!inner)return;inner.classList.remove("drag");inner.style.transform="";inner=null;dx=0});
  // Evita que el toque del deslizamiento cuente también como «dar la vuelta»
  main.addEventListener("click",ev=>{if(swiped){swiped=false;ev.stopImmediatePropagation();ev.preventDefault()}},true);
})();

/* ===================== ACTUALIZACIÓN AUTOMÁTICA ===================== */
function verNovedades(desde){
  const todas=NOVEDADES.filter(([v])=>!desde||verCmp(v,desde)>0);
  if(!todas.length)return;
  const s=$("#sheet");
  s.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Novedades">
    <div class="grab"></div><button class="xbtn" data-close="1" aria-label="Cerrar">✕</button><h2>${desde?"¡La app se ha actualizado!":"Novedades"}</h2>
    <div class="nov">${todas.slice(0,4).map(([v,items])=>`<h4>Versión ${v}</h4><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>`).join("")}</div>
    <div class="sheet-nav"><button class="btn block" data-close="1">Entendido</button></div>
  </div></div>`;
  s.hidden=false;sheetShown();
}
(function(){
  const vista=store.get("tp-version",null);
  store.set("tp-version",VERSION);
  if(vista&&verCmp(VERSION,vista)>0)setTimeout(()=>verNovedades(vista),600);
})();

// Solo en la web publicada (GitHub Pages) o en pruebas locales
const EN_WEB=/\.github\.io$/.test(location.hostname)||location.hostname==="localhost";
let actPendiente=false;
// Nunca se recarga en mitad de un test ni de un mazo de fichas, ni con una ficha abierta
function seguroRecargar(){
  if(!$("#sheet").hidden)return false;
  if(PREF.tab==="test"&&QZ&&!QZ.done)return false;
  if(PREF.tab==="test"&&FILL&&!FILL.done&&FILL.pos>0)return false;
  if(PREF.tab==="juego"&&GAME&&!GAME.done&&GAME.placed.size>0)return false;
  if(PREF.tab==="fichas"&&FL&&FL.i>0&&FL.i<FL.deck.length)return false;
  return true;
}
function actualizar(){
  if(!seguroRecargar()){actPendiente=true;return}
  $("#barra-act").hidden=false;
  setTimeout(()=>location.replace(location.pathname+"?u="+Date.now()),900);
}
let lastCheck=0;
async function buscarVersion(force){
  if(!EN_WEB)return null;
  if(!force&&Date.now()-lastCheck<4000)return null; // evita comprobar dos veces seguidas
  lastCheck=Date.now();
  try{
    const txt=await (await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})).text();
    const m=txt.match(/name="app-version" content="([^"]+)"/);
    if(m&&verCmp(m[1],VERSION)>0){actualizar();return m[1]}
    return VERSION;
  }catch(e){return null}
}
// Si había una versión esperando, se aplica en cuanto se puede (al cambiar de pestaña, cerrar una ficha, acabar un test…)
new MutationObserver(()=>{if(actPendiente&&seguroRecargar()){actPendiente=false;actualizar()}})
  .observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["hidden","aria-current"]});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")buscarVersion()});
setInterval(buscarVersion,90*1000);
buscarVersion();
addEventListener("focus",buscarVersion);
addEventListener("pageshow",buscarVersion);
// Limpia la marca ?u= de la dirección tras actualizar
if(/[?&]u=/.test(location.search))history.replaceState(history.state,"",location.pathname);
// Sin internet: el service worker guarda la app para que funcione sin conexión
if(EN_WEB&&"serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
}
</script>
